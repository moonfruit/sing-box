name: Tap bump check

# 一次性的验证台：只跑 tap-bump 那一段，针对一个已发布的 tag。
# 用途是验证 Homebrew 容器方案，避免为此重跑一次 30 分钟的完整构建。
# 验证通过后本文件即可删除。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "已发布的 moonfruit tag，例如 v1.14.0-beta.8-reF1nd-moonfruit.4"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tap-bump:
    name: 更新 Homebrew tap（验证）
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew:main
    defaults:
      run:
        # 容器里 run: 的默认 shell 是 sh（dash），它不认 set -o pipefail。
        shell: bash
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      # 必须排在 checkout 之前：容器以 linuxbrew 用户运行，写不了 runner 的
      # _temp 目录，checkout 会直接 EACCES。这个 action 负责把容器内的用户与
      # 权限理顺，tap 自己的 test-bot 也是这么起手的。
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不用 actions/checkout：它会再装一个局部认证头，与 setup-homebrew 的全局头
      # 撞成 Duplicate header 400；而摘掉全局头又会让 setup-homebrew 的 post 清理
      # 脚本以 exit 5 收场，把整个 job 拖红。这里只需要 ci 分支上的 scripts/，
      # 仓库是公开的，浅克隆一份即可，两边都不碰。
      - name: 取出自动化脚本
        run: git clone --depth 1 --branch ci "https://github.com/${GITHUB_REPOSITORY}.git" ci

      - name: 准备 Homebrew 环境
        run: |
          set -euo pipefail
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$PWD/ci"
          command -v gh >/dev/null || brew install gh

      - name: bump 并打 pr-pull
        id: bump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_PAT }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          brew tap moonfruit/tap
          bash ci/scripts/tap-bump.sh "$TARGET"
