name: Tap bump check

# 一次性的验证台：只跑 tap-bump 那一段，针对一个已发布的 tag。
# 用途是验证 Homebrew 容器方案，避免为此重跑一次 30 分钟的完整构建。
# 验证通过后本文件即可删除。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "已发布的 moonfruit tag，例如 v1.14.0-beta.8-reF1nd-moonfruit.4"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tap-bump:
    name: 更新 Homebrew tap（验证）
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew:main
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      # 必须排在 checkout 之前：容器以 linuxbrew 用户运行，写不了 runner 的
      # _temp 目录，checkout 会直接 EACCES。这个 action 负责把容器内的用户与
      # 权限理顺，tap 自己的 test-bot 也是这么起手的。
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-homebrew 会装一个全局的 git 认证头，actions/checkout 还会再加一个
      # 局部的，两个 Authorization 撞在一起服务端直接 400。checkout 自带凭据，
      # 摘掉全局那个即可。
      - name: 摘掉全局 git 认证头
        run: git config --global --unset-all http.https://github.com/.extraheader || true

      - uses: actions/checkout@v5
        with: { ref: ci }

      - name: 准备 Homebrew 环境
        run: |
          set -euo pipefail
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$PWD"
          command -v gh >/dev/null || brew install gh

      - name: bump 并打 pr-pull
        id: bump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_PAT }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          brew tap moonfruit/tap
          bash scripts/tap-bump.sh "$TARGET"
