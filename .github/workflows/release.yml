name: Release

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      base_tag:
        description: "指定 reF1nd 基点 tag，留空则自动检测"
        required: false
        type: string
      force:
        description: "目标 tag 已存在时仍重建"
        required: false
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  UPSTREAM_REPO: reF1nd/sing-box
  INTEGRATION_BRANCH: moonfruit
  # 钉在 1.26。Go 1.27 起，transport/v2rayhttp/force_close.go 里那条
  #   //go:linkname transportConnPool golang.org/x/net/http2.(*Transport).connPool
  # 在链接期报 "relocation target ... not defined"：x/net 侧没有配套的 push
  # linkname，这个符号留不留得住取决于编译器对该方法的内联/裁剪决策，1.27 不再
  # 留了。上游 sing-box 至今未动过这个文件，与本 fork 的 patch 无关；实测
  # beta.17 与 rc.1 两个 tag 在 1.26.6 下都能编、在 1.27.0 下都编不过。
  # homebrew-core 的 sing-box 撞上同一堵墙、同样钉了 go@1.26，本 tap 的
  # sing-box-ref1nd.rb 已跟进。等 SagerNet/sing-box#4182 落地后改回 "stable"。
  #
  # 用系列号而非某个补丁号：与 tap 侧的 go@1.26 保持同一口径（Homebrew 只能钉到
  # 系列），同时还能跟上 1.26.x 的安全补丁。
  GO_VERSION: "1.26"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: 检测基点
    runs-on: ubuntu-latest
    # issue_comment 会为仓库内任意评论创建 run，这里立即短路。
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, '/ship')
      )
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      base:         ${{ steps.decide.outputs.base }}
      cur_base:     ${{ steps.decide.outputs.cur_base }}
      target:       ${{ steps.decide.outputs.target }}
      prev_target:  ${{ steps.decide.outputs.prev_target }}
      ship_ref:     ${{ steps.ship.outputs.ship_ref }}
    steps:
      - name: 取出自动化分支
        uses: actions/checkout@v7
        with: { ref: ci, path: ci }

      - name: 取出完整仓库
        uses: actions/checkout@v7
        with: { fetch-depth: 0, path: src }

      - name: 拉取 reF1nd 的 tag 并落地集成分支
        working-directory: src
        run: |
          set -euo pipefail
          git remote add ref1nd "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --quiet ref1nd
          # actions/checkout 只建立 origin/* 远端引用；detect.sh 要对
          # $INTEGRATION_BRANCH 跑 git describe / rev-parse，需要本地分支存在。
          git branch -f "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"

      - name: 解析放行目标
        id: ship
        # 放行只有一条路径：在审查 PR 内评论 /ship。分支 auto/resolve-<TARGET> 由
        # review-pr.sh 自动建出，人工无需、也无从指定它。
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN:  ${{ github.token }}
          PR:        ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          ref=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          # 校验分支名：否则在任意一个 PR 下评论 /ship 都能把那条 head 发出去
          case "$ref" in
            auto/resolve-*) ;;
            *) echo "::error::${ref} 不是冲突解决分支" >&2; exit 1 ;;
          esac
          echo "ship_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 判定
        id: decide
        working-directory: src
        env:
          GH_TOKEN:  ${{ github.token }}
          BASE_TAG:  ${{ inputs.base_tag }}
          FORCE:     ${{ inputs.force }}
          SHIP_REF:  ${{ steps.ship.outputs.ship_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${SHIP_REF:-}" ]]; then
            # 放行路径：目标 tag 直接从分支名反推，无需检测上游
            target="${SHIP_REF#auto/resolve-}"
            . ../ci/scripts/version.sh
            {
              echo "should_build=true"
              echo "base=$(base_of "$target")"
              echo "cur_base=$(base_of "$target")"
              echo "target=${target}"
              echo "prev_target="
            } >> "$GITHUB_OUTPUT"
          else
            bash ../ci/scripts/detect.sh
          fi

  prepare:
    name: 准备集成分支
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      # prepare 自己已经发过专属通知的路径，notify-failure 据此避让
      notified: ${{ steps.review.outputs.notified || steps.conflict.outputs.notified }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: ci, path: ci }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src
          # 不让 actions/checkout 把凭据持久写进 src/.git/config：这个目录后面
          # 会跑 claude -p --permission-mode auto，它的提示词里含第三方内容
          # （reF1nd 的提交说明）。若 .git/config 里躺着一个跨仓库、长期有效
          # 的 PAT，任何能引导它执行 git 命令的输入都能顺手把凭据带出去。
          # 真正需要推送（集成分支/审查 PR 的临时分支都带着上游的
          # .github/workflows/，GITHUB_TOKEN 是 App 令牌、没有 workflow scope）
          # 的步骤，改为用 scripts/lib.sh 的 git_auth_set/git_auth_clear
          # 现取现用、用完即清。
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: 配置 git 身份并拉取 reF1nd tag
        working-directory: src
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add ref1nd "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --quiet ref1nd
          git checkout -q -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"

      - name: 放行冲突解决分支
        id: ship
        if: needs.detect.outputs.ship_ref != ''
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REF: ${{ needs.detect.outputs.ship_ref }}
        run: |
          set -euo pipefail
          . ../ci/scripts/lib.sh
          git_auth_set "$GH_TOKEN"
          git fetch -q origin "$SHIP_REF"
          git_auth_clear
          git reset --hard FETCH_HEAD

      - name: rebase 到新基点
        id: rebase
        if: needs.detect.outputs.ship_ref == ''
        working-directory: src
        continue-on-error: true
        env:
          BASE: ${{ needs.detect.outputs.base }}
        run: bash ../ci/scripts/rebase.sh "$BASE" "$INTEGRATION_BRANCH"

      - name: 自动解决冲突
        id: resolve
        if: steps.rebase.outcome == 'failure'
        working-directory: src
        continue-on-error: true
        # 没有这道上限，claude 卡死会占满默认的 6 小时，且 concurrency: group: release
        # 会堵住后续所有 run（包括次日的 cron）。
        timeout-minutes: 60
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CUR_BASE: ${{ needs.detect.outputs.cur_base }}
          BASE:     ${{ needs.detect.outputs.base }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@latest
          # 冒烟测试：不锁版本，--permission-mode auto 这类 CLI 参数哪天改名/移除，
          # 冲突解决器就会在唯一真正用得上它的那天失效，而日志上跟「模型解不开冲突」
          # 同形，排查时容易先怀疑错方向 —— 先在这里就地暴露出来。
          claude --version
          bash ../ci/scripts/resolve.sh "$CUR_BASE" "$BASE"

      - name: 开审查 PR
        id: review
        if: steps.rebase.outcome == 'failure' && steps.resolve.outcome == 'success'
        working-directory: src
        env:
          GH_TOKEN:     ${{ github.token }}
          GH_PAT:       ${{ secrets.GH_PAT }}
          BARK_URL:     ${{ secrets.BARK_URL }}
          CUR_BASE:     ${{ needs.detect.outputs.cur_base }}
          BASE:         ${{ needs.detect.outputs.base }}
          TARGET:       ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          . ../ci/scripts/notify.sh
          # review-pr.sh 要推 base/*、auto/resolve-* 两条临时分支，两者都带着上游的
          # .github/workflows/，需要 workflow scope 的 PAT。这一步在 claude 之后，
          # 现取现用、用完即清，凭据不会在 claude 的执行窗口内出现在 .git/config 里。
          git_auth_set "$GH_PAT"
          url=$(bash ../ci/scripts/review-pr.sh "$BASE" "$TARGET")
          git_auth_clear
          bark "冲突已自动解决，待审查" "${TARGET}：在 PR 内评论 /ship 放行" "$url"
          echo "notified=review-pr" >> "$GITHUB_OUTPUT"

      # 中止单独成步：上一步必须成功结束，notified 这个 output 才会被记录下来，
      # notify-failure 才能据此把「有意中止」与「真失败」区分开。
      - name: 已开审查 PR，中止本次发布
        if: steps.review.outcome == 'success'
        run: exit 1

      - name: 冲突未能自动解决
        id: conflict
        if: steps.rebase.outcome == 'failure' && steps.resolve.outcome == 'failure'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          BARK_URL: ${{ secrets.BARK_URL }}
          CUR_BASE: ${{ needs.detect.outputs.cur_base }}
          BASE:     ${{ needs.detect.outputs.base }}
          TARGET:   ${{ needs.detect.outputs.target }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: |
          set -euo pipefail
          . ../ci/scripts/notify.sh
          body=$(mktemp)
          cat > "$body" <<EOF
          rebase \`${CUR_BASE}\` → \`${BASE}\` 冲突，自动解决未通过。

          本地接管：

          \`\`\`bash
          git fetch origin --tags && git fetch ref1nd --tags
          git rebase --onto ${BASE} ${CUR_BASE} moonfruit
          git push -f origin moonfruit
          \`\`\`

          Actions run: ${RUN_URL}
          EOF
          # bark 排在 issue 之前，且 issue 失败不拿 || 吞掉都不能中止本步：
          # issue 未开启或标签缺失时 open_or_comment_issue 会在 set -e 下整步
          # 死掉，顺序反过来的话 Bark 也响不了。
          bark "rebase 冲突待人工处理" "$TARGET" "$ISSUES_URL"
          open_or_comment_issue "$TARGET" "$body" \
            || log "开 issue 失败，已忽略（Bark 已发出）"
          echo "notified=conflict" >> "$GITHUB_OUTPUT"

      # 同样把中止拆出来，理由与上面那条一致
      - name: 冲突已通知，中止本次发布
        if: steps.conflict.outcome == 'success'
        run: exit 1

      - name: 推送集成分支与 tag
        id: run
        working-directory: src
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          GH_PAT:   ${{ secrets.GH_PAT }}
          BASE:     ${{ needs.detect.outputs.base }}
          TARGET:   ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          . ../ci/scripts/rebase.sh
          assert_no_markers
          # 推 workflow 文件所在的分支与 tag，需要带 workflow scope 的 PAT；
          # 现取现用、用完即清（见 checkout 的 persist-credentials: false 注释）。
          git_auth_set "$GH_PAT"
          git push -f origin "HEAD:refs/heads/${INTEGRATION_BRANCH}"
          git tag "$TARGET"
          git push origin "refs/tags/${TARGET}"
          git_auth_clear
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          . ../ci/scripts/notify.sh
          bark "已打 tag ${TARGET}" \
               "基点 ${BASE}；$(git log --oneline "${BASE}..HEAD" | wc -l | tr -d ' ') 个 patch" \
               "${{ github.server_url }}/${{ github.repository }}/releases/tag/${TARGET}"

      # spec §6.3 承诺「审查通过后删除」auto/resolve-*、base/* 分支并关闭 PR，
      # 但发布流程从未兑现过这个承诺。只在放行路径（ship_ref 非空）下做，
      # 因为只有这条路径才可能真的有临时分支和 PR 存在。
      - name: 清理临时分支并关闭审查 PR
        if: needs.detect.outputs.ship_ref != ''
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT:   ${{ secrets.GH_PAT }}
          TARGET:   ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          . ../ci/scripts/lib.sh
          git_auth_set "$GH_PAT"
          git push origin --delete "auto/resolve-${TARGET}" || true
          git push origin --delete "base/${TARGET}" || true
          git_auth_clear
          num=$(gh pr list --state open --head "auto/resolve-${TARGET}" \
                  --json number --jq '.[0].number // empty')
          [[ -z "$num" ]] || gh pr close "$num" --comment "已发布 ${TARGET}，关闭本 PR。"

  build:
    name: 构建 ${{ matrix.variant }}
    needs: [detect, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [purego, glibc, musl]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.target }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }

      - name: 组装 build tags
        env:
          TARGET: ${{ needs.detect.outputs.target }}
        run: |
          set -xeuo pipefail
          TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          case "${{ matrix.variant }}" in
            purego) TAGS="${TAGS},with_purego" ;;
            musl)   TAGS="${TAGS},with_musl" ;;
          esac
          {
            echo "BUILD_TAGS=${TAGS}"
            echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)"
            echo "VERSION=${TARGET#v}"
          } >> "$GITHUB_ENV"

      # purego 不编译 C 代码，只需要 cronet-go 仓库里那份预编译的 libcronet.so
      # （见下面「提取 libcronet.so」），克隆源码与 Chromium 工具链这几步整个跳过。
      # sparse-checkout 排除 /lib：自 cronet-go ec9a39c 起，20+ 个平台的预编译
      # libcronet.{a,so}（单个 .a 就有 60 MB）直接提交进了仓库，全量拉会平白
      # 多下 1 GB 以上。
      - name: 克隆 cronet-go
        if: matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: 重建 Debian keyring
        if: matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: 缓存 Chromium 工具链
        if: matrix.variant != 'purego'
        uses: actions/cache@v6
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-arm64-${{ matrix.variant }}-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: 下载工具链并注入环境
        if: matrix.variant != 'purego'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          libc=()
          [[ "${{ matrix.variant }}" == musl ]] && libc=(--libc=musl)
          go run ./cmd/build-naive --target=linux/arm64 "${libc[@]}" download-toolchain
          go run ./cmd/build-naive --target=linux/arm64 "${libc[@]}" env >> "$GITHUB_ENV"

      - name: 构建
        env:
          GOOS: linux
          GOARCH: arm64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail
          if [[ "${{ matrix.variant }}" == purego ]]; then export CGO_ENABLED=0; else export CGO_ENABLED=1; fi
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # cronet-go ec9a39c（上游 7afc0aa2b「Update naiveproxy to v150.0.7871.63-1」
      # 引入）删掉了 build-naive 的 extract-lib 子命令，改把预编译产物直接提交进
      # 仓库。这里跟官方 build.yml 一样，单独稀疏检出那一个文件。
      - name: 提取 libcronet.so
        if: matrix.variant == 'purego'
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/linux_arm64/libcronet.so"
          git init "$RUNNER_TEMP/cronet-go-lib"
          git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/

      - name: 打包
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${VERSION}-linux-arm64"
          case "${{ matrix.variant }}" in
            glibc) DIR_NAME="${DIR_NAME}-glibc" ;;
            musl)  DIR_NAME="${DIR_NAME}-musl" ;;
          esac
          cd dist
          mkdir -p "$DIR_NAME"
          cp ../LICENSE sing-box "$DIR_NAME"
          if [ -f libcronet.so ]; then cp libcronet.so "$DIR_NAME"; fi
          tar -czvf "${DIR_NAME}.tar.gz" "$DIR_NAME"
          rm -r "$DIR_NAME" sing-box
          rm -f libcronet.so

      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux_arm64-${{ matrix.variant }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布
    needs: [detect, prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET:   ${{ needs.detect.outputs.target }}
          BASE:     ${{ needs.detect.outputs.base }}
        run: |
          set -euo pipefail
          # $BASE 是 reF1nd 的 tag，从未推到本仓库；不取回它，下面的 git log 区间
          # 无法解析，整个 release job 会在生成 notes 时就挂掉。
          git remote add ref1nd "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --quiet ref1nd
          notes=$(mktemp)
          {
            # shellcheck disable=SC2016
            printf '基于 [`%s`](https://github.com/%s/releases/tag/%s) 构建。\n\n' \
              "$BASE" "$UPSTREAM_REPO" "$BASE"
            printf '本版包含的 patch：\n\n'
            git log --format='- %s' "${BASE}..${TARGET}"
          } > "$notes"
          gh release create "$TARGET" --title "$TARGET" --notes-file "$notes" dist/*.tar.gz

  tap-bump:
    name: 更新 Homebrew tap
    needs: [detect, release]
    runs-on: ubuntu-latest
    # 跑在官方 Homebrew 容器里，与 tap 自己的 test-bot 一致。宿主 ubuntu 镜像虽然
    # 自带 linuxbrew，但要靠猜死路径把它塞进 PATH、要手工补 git 身份，且环境随
    # runner 镜像漂移 —— 这一类问题已经连着咬了三次。容器把它们一次性消掉。
    container: ghcr.io/homebrew/brew:main
    defaults:
      run:
        # 容器里 run: 的默认 shell 是 sh（dash），它不认 set -o pipefail。
        shell: bash
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      # 必须排在 checkout 之前：容器以 linuxbrew 用户运行，写不了 runner 的
      # _temp 目录，checkout 会直接 EACCES。这个 action 负责把容器内的用户与
      # 权限理顺，tap 自己的 test-bot 也是这么起手的。
      #
      # token 只能给 GH_PAT。这个 action 会把它写成全局的
      # http.https://github.com/.extraheader；git 走 libcurl，自定义的
      # Authorization 头会顶掉 URL 里带的凭据。而 bump-formula-pr 恰恰是把
      # HOMEBREW_GITHUB_API_TOKEN 拼进 push 的 URL 里的（bump.rb 的
      # add_auth_token_to_url!），于是真正生效的是这个全局头 —— 给
      # GITHUB_TOKEN 就只有本仓库的权限，推 tap 直接 403
      # "Permission to moonfruit/homebrew-tap.git denied to github-actions[bot]"。
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GH_PAT }}

      # 不用 actions/checkout：它会再装一个局部认证头，与 setup-homebrew 的全局头
      # 撞成 Duplicate header 400；而摘掉全局头又会让 setup-homebrew 的 post 清理
      # 脚本以 exit 5 收场，把整个 job 拖红。这里只需要 ci 分支上的 scripts/，
      # 仓库是公开的，浅克隆一份即可，两边都不碰。
      - name: 取出自动化脚本
        run: git clone --depth 1 --branch ci "https://github.com/${GITHUB_REPOSITORY}.git" ci

      - name: 准备 Homebrew 环境
        run: |
          set -euo pipefail
          # bump-formula-pr 会在 brew 自己的 tap 克隆里 git commit，那里不在
          # actions/checkout 的作用范围内，没有全局身份就会 fatal: empty ident name
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 容器里 checkout 出来的目录属主与运行用户不同，git 会拒绝操作
          git config --global --add safe.directory "$PWD/ci"
          # 容器内没有 gh；tap-bump.sh 用它查 CI 状态并打标签
          command -v gh >/dev/null || brew install gh

      - name: bump 并打 pr-pull
        id: bump
        env:
          # brew 认这个环境变量名，值来自统一的 GH_PAT
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_PAT }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TARGET: ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          # bump-formula-pr 只认已 tap 的 formula，runner 上必须先 tap。
          brew tap moonfruit/tap
          bash ci/scripts/tap-bump.sh "$TARGET"
      - name: 完成通知
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          TARGET:   ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          . ci/scripts/notify.sh
          bark "${TARGET} 发布完成" "tap PR 已开并打上 pr-pull" "${{ steps.bump.outputs.tap_pr }}"

  gitee-push:
    name: 推送 Gitee
    needs: [detect, release]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 musl 产物
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET:   ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 本 job 不 checkout，CWD 不是 git 仓库，gh 无法凭本地 remote 推断
          # 目标仓库，必须显式传 --repo。
          gh release download "$TARGET" --repo "${{ github.repository }}" \
            --pattern '*linux-arm64-musl.tar.gz' --dir dist
      - name: 强推 binary 分支
        env:
          GITEE_USER:  ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TARGET:      ${{ needs.detect.outputs.target }}
        run: |
          set -euo pipefail
          test -n "$GITEE_USER"  || { echo "::error::GITEE_USER 缺失" >&2; exit 1; }
          test -n "$GITEE_TOKEN" || { echo "::error::GITEE_TOKEN 缺失" >&2; exit 1; }
          work=$(mktemp -d)
          cp dist/sing-box-*-linux-arm64-musl.tar.gz "$work/"
          printf '%s\n' "${TARGET#v}" > "$work/version.txt"
          cd "$work"
          git init -q -b binary
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "sing-box ${TARGET} linux-arm64-musl"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/moonfruit/private.git"
          git push --progress --verbose -f gitee binary

  notify-failure:
    name: 失败通知
    needs: [detect, prepare, build, release, gitee-push, tap-bump]
    # 只用 failure()，不叠加 should_build 守卫：无需构建又无失败时 failure() 本就
    # 不成立，那个守卫唯一的实际效果是吞掉 detect 自身崩溃时的通知 —— 而每日 cron
    # 悄无声息地停摆，恰恰是最该被告知的故障。
    #
    # 但要避开 prepare 里两条自带专属通知的路径（已开审查 PR、冲突待人工处理）：
    # 本 job 是「没有专属通知的故障」的兜底，重复响一次只会制造噪音，
    # 前者更会违反「开了 PR 就不再开 issue」。
    if: failure() && needs.prepare.outputs.notified == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: ci }
      - env:
          GH_TOKEN: ${{ github.token }}
          BARK_URL: ${{ secrets.BARK_URL }}
          # detect 崩溃时 target 为空，给个兜底文案，issue 标题才不会是半截
          TARGET:   ${{ needs.detect.outputs.target || '目标 tag 未能确定' }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          . scripts/notify.sh
          body=$(mktemp)
          # shellcheck disable=SC2016
          printf '发布 `%s` 失败。\n\nActions run: %s\n' "$TARGET" "$RUN_URL" > "$body"
          # bark 排在 issue 之前，且 issue 失败不能中止本步 —— 理由同 prepare 里
          # 「冲突未能自动解决」那一步。
          bark "发布失败：${TARGET}" "见 Actions run" "$RUN_URL"
          open_or_comment_issue "$TARGET" "$body" \
            || log "开 issue 失败，已忽略（Bark 已发出）"
